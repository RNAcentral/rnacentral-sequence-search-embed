include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  DS_ENFORCE_NEW_ANALYZER: 'true'
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

# No Container-Scanning template here — this repo has no Dockerfile.
# It's an npm-built embeddable widget, not a container image, so there's
# nothing for container_scanning to pull. Dependency Scanning reads
# package-lock.json directly; no extra prep job needed.

sast:
  tags:
    - dind

gitlab-advanced-sast:
  variables:
    SEARCH_MAX_DEPTH: 20
    SAST_ANALYZER_IMAGE_TAG: '2.50'

secret_detection:
  tags:
    - dind

dependency_scanning:
  tags:
    - dind
