include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml   # Dockerfiles + k8s manifests (KICS)

variables:
  DS_ENFORCE_NEW_ANALYZER: 'true'
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

# No Container-Scanning template here — this repo has no Dockerfile.
# It's an npm-built embeddable widget, not a container image, so there's
# nothing for container_scanning to pull. Dependency Scanning reads
# package-lock.json directly; no extra prep job needed.

sast:
  tags:
    - dind

gitlab-advanced-sast:
  variables:
    SEARCH_MAX_DEPTH: 20
    SAST_ANALYZER_IMAGE_TAG: '2.50'

secret_detection:
  tags:
    - dind

dependency_scanning:
  tags:
    - dind

# Posts to Slack when this pipeline's scans find Critical vulnerabilities that are
# not in the latest default-branch scan. Needs the masked CI/CD variable
# SLACK_WEBHOOK_URL (Settings > CI/CD > Variables).
# Runs in the built-in .post stage, so no stages list is needed.
notify-new-vulnerabilities:
  stage: .post
  image: alpine:3.20
  tags:
    - dind
  rules:
    - when: always
  needs:
    - job: sast
      optional: true
    - job: gitlab-advanced-sast
      optional: true
    - job: semgrep-sast
      optional: true
    - job: kics-iac-sast
      optional: true
    - job: dependency_scanning
      optional: true
    - job: secret_detection
      optional: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - ./scripts/notify_new_vulnerabilities.sh
  allow_failure: true
