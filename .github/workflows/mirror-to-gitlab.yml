name: Mirror to GitLab

on:
  push:
    branches:
      - master

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push squashed snapshot to GitLab
        run: |
          git remote add gitlab https://gitlab-ci-token:${{ secrets.GITLAB_TOKEN }}@gitlab.ebi.ac.uk/RNAcentral/rnacentral-sequence-search-embed.git
          # GitLab's instance enforces a pre-receive hook requiring commit
          # authors to be recognized team members. This repo's real history
          # has contributors whose git-config emails don't match their
          # GitLab account, which blocks pushing full history. Since this
          # mirror exists only for GitLab security scanning (not
          # collaborative development), each run instead appends one
          # re-authored snapshot commit on top of whatever is already on
          # GitLab, so the push is always a plain fast-forward.
          PARENT=$(git ls-remote gitlab refs/heads/master | cut -f1)
          TREE=$(git rev-parse HEAD^{tree})
          if [ -n "$PARENT" ]; then
            COMMIT=$(GIT_AUTHOR_NAME="GitLab Mirror" GIT_AUTHOR_EMAIL="muston@ebi.ac.uk" \
                      GIT_COMMITTER_NAME="GitLab Mirror" GIT_COMMITTER_EMAIL="muston@ebi.ac.uk" \
                      git commit-tree "$TREE" -p "$PARENT" -m "Mirror snapshot of ${{ github.sha }}")
          else
            COMMIT=$(GIT_AUTHOR_NAME="GitLab Mirror" GIT_AUTHOR_EMAIL="muston@ebi.ac.uk" \
                      GIT_COMMITTER_NAME="GitLab Mirror" GIT_COMMITTER_EMAIL="muston@ebi.ac.uk" \
                      git commit-tree "$TREE" -m "Mirror snapshot of ${{ github.sha }}")
          fi
          git push gitlab "$COMMIT:refs/heads/master"
