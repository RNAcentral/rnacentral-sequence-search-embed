name: Mirror to GitLab

on:
  push:
    branches:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push squashed snapshot to GitLab
        run: |
          git remote add gitlab https://gitlab-ci-token:${{ secrets.GITLAB_TOKEN }}@gitlab.ebi.ac.uk/RNAcentral/rnacentral-sequence-search-embed.git
          # Re-authored squash commit per branch: dodges GitLab's pre-receive
          # author hook and gives every branch a ref for per-branch scanning.
          BRANCH="${{ github.ref_name }}"
          PARENT=$(git ls-remote gitlab "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$PARENT" ]; then
            git fetch --depth=1 gitlab "$BRANCH"
          fi
          TREE=$(git rev-parse HEAD^{tree})
          if [ -n "$PARENT" ]; then
            COMMIT=$(GIT_AUTHOR_NAME="GitLab Mirror" GIT_AUTHOR_EMAIL="muston@ebi.ac.uk" \
                      GIT_COMMITTER_NAME="GitLab Mirror" GIT_COMMITTER_EMAIL="muston@ebi.ac.uk" \
                      git commit-tree "$TREE" -p "$PARENT" -m "Mirror snapshot of ${{ github.sha }}")
          else
            COMMIT=$(GIT_AUTHOR_NAME="GitLab Mirror" GIT_AUTHOR_EMAIL="muston@ebi.ac.uk" \
                      GIT_COMMITTER_NAME="GitLab Mirror" GIT_COMMITTER_EMAIL="muston@ebi.ac.uk" \
                      git commit-tree "$TREE" -m "Mirror snapshot of ${{ github.sha }}")
          fi
          git push gitlab "$COMMIT:refs/heads/$BRANCH"
